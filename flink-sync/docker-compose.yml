version: '3.8'
services:
  jobmanager:
    image: flink:1.18.0-java11
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./lib:/opt/flink/lib_extra
      - ./sql:/opt/flink/sql
    networks:
      - flink-network

  taskmanager:
    image: flink:1.18.0-java11
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./lib:/opt/flink/lib_extra
      - ./sql:/opt/flink/sql
    networks:
      - flink-network

  mysql_target:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: target_db
      MYSQL_USER: target_user
      MYSQL_PASSWORD: target_password
    volumes:
      - ./sql/init_target.sql:/docker-entrypoint-initdb.d/init_target.sql
    networks:
      - flink-network

networks:
  flink-network:
    driver: bridge
