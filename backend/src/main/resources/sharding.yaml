rules:
- !SHARDING
  tables:
    t_order:
      actualDataNodes: ds$->{0..3}.t_order_$->{0..15}
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: database-inline
      tableStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: t-order-table-inline
      keyGenerateStrategy:
        column: order_id
        keyGeneratorName: snowflake
    balances:
      actualDataNodes: ds$->{0..3}.balances
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: database-inline
    deposits:
      actualDataNodes: ds$->{0..3}.deposits
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: database-inline
  shardingAlgorithms:
    database-inline:
      type: INLINE
      props:
        algorithm-expression: ds$->{Math.abs(user_id.hashCode()) % 4}
    t-order-table-inline:
      type: INLINE
      props:
        algorithm-expression: t_order_$->{Math.abs(user_id.hashCode()) % 16}
  keyGenerators:
    snowflake:
      type: SNOWFLAKE

props:
  sql-show: true
