dataSources:
  ds0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://212.227.166.131:9257/myapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: hobart
    password: 123456
    # HikariCP connection pool properties
    data-source-properties:
      cachePrepStmts: true
      prepStmtCacheSize: 250
      prepStmtCacheSqlLimit: 2048
    connectionTimeout: 30000
    validationTimeout: 5000
    idleTimeout: 600000
    maxLifetime: 1800000
    maximumPoolSize: 10
    minimumIdle: 2
    keepaliveTime: 300000

rules:
- !SHARDING
  tables:
    users:
      actualDataNodes: ds0.users_$->{0..2}
      tableStrategy:
        standard:
          shardingColumn: id
          shardingAlgorithmName: users-inline
    # Non-sharded tables - single table in ds0
    balances:
      actualDataNodes: ds0.balances
    deposits:
      actualDataNodes: ds0.deposits
    trades:
      actualDataNodes: ds0.trades
  shardingAlgorithms:
    users-inline:
      type: INLINE
      props:
        algorithm-expression: users_$->{id % 3}

props:
  sql-show: true
